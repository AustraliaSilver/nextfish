name: Unit Tests

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - ".github/workflows/unit-tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip python-chess

      - name: Compile every Python file
        run: |
          set -euo pipefail
          for f in $(ls tests/*.py scripts/*.py tools/*.py nextfish-harenn/*.py); do
            python3 -m py_compile "$f"
          done

      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -p "test_units.py" -v
