name: HARENN Continuous Data Generation

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data-generation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Setup Python & environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-chess huggingface_hub

      - name: Download Stockfish 18
        run: |
          curl -L -o stockfish.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
          tar -xvf stockfish.tar
          mv stockfish/stockfish-ubuntu-x86-64-avx2 ./harenn_engine
          chmod +x harenn_engine
          chmod +x parallel_generate.py

      - name: Generate Data (time-budgeted)
        run: |
          mkdir -p data
          python3 parallel_generate.py --engine ./harenn_engine --output ./data --games 100 --concurrency 2 --time-budget 16200 --worker-id ${{ matrix.worker_id }}
          echo "=== files in data/ ==="
          ls data/ | head -5
          echo "total files: $(ls data/ | wc -l)"

      - name: Pack and Upload Data to Hugging Face Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, glob, sys, json, time
          from datetime import datetime
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("::error::HF_TOKEN secret is not set in Repository Secrets!")
              sys.exit(1)

          files = glob.glob("data/*.json") + glob.glob("data/*.jsonl")
          print(f"Total raw files generated by Worker: {len(files)}")
          if not files:
              print("No new data files generated to upload.")
              sys.exit(0)

          # Pack all positions generated during the run into 1 single JSONL file
          ts = datetime.utcnow().strftime("%Y%m%d_%H%M%S")
          worker_id = "${{ matrix.worker_id }}"
          run_id = "${{ github.run_id }}"
          packed_filename = f"hnn_w{worker_id}_{run_id}_{ts}.jsonl"
          packed_path = os.path.join("data", packed_filename)

          total_positions = 0
          print(f"Packing all positions into single file: {packed_filename}...")
          with open(packed_path, "w", encoding="utf-8") as out_f:
              for f in files:
                  if f == packed_path:
                      continue
                  if f.endswith(".json"):
                      try:
                          with open(f, "r", encoding="utf-8") as in_f:
                              data = json.load(in_f)
                              for p in data.get("positions", []):
                                  out_f.write(json.dumps(p) + "\n")
                                  total_positions += 1
                      except Exception as e:
                          print(f"Warning: skipped corrupted file {f}: {e}")
                  elif f.endswith(".jsonl"):
                      try:
                          with open(f, "r", encoding="utf-8") as in_f:
                              for line in in_f:
                                  line = line.strip()
                                  if line:
                                      out_f.write(line + "\n")
                                      total_positions += 1
                      except Exception as e:
                          print(f"Warning: skipped corrupted file {f}: {e}")

          size_mb = os.path.getsize(packed_path) / (1024 * 1024)
          print(f"Successfully packed {total_positions:,} positions into {packed_filename} ({size_mb:.2f} MB)")

          # Upload single packed file to Hugging Face Bucket
          api = HfApi(token=token)
          bucket_id = "australia1/myrandombucket"
          print(f"Uploading {packed_filename} to bucket '{bucket_id}'...")
          t0 = time.time()
          api.batch_bucket_files(bucket_id, add=[(packed_path, packed_filename)])
          dt = time.time() - t0
          print(f"Upload completed in {dt:.2f} seconds!")
          EOF
